# MineHonk cloud hub: accounts, friends, join codes, the public world list,
# WebRTC signaling and the relay for browser-hosted worlds.
# Deployed by .github/workflows/deploy-hub.yml (no terminal needed).
name = "minehonk-hub"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Sites allowed to call the hub (the game on GitHub Pages)
ALLOWED_ORIGINS = "https://chrishonk9014-commits.github.io"
# The Haunting: the Claude model Herobrine answers with, and how many answers a
# day (across everyone) before he falls back to his scripted lines. He only
# uses Claude when the ANTHROPIC_API_KEY secret is set (docs/ONLINE_SETUP.md).
HEROBRINE_MODEL = "claude-haiku-5-5"
HEROBRINE_DAILY_LIMIT = "200"
# V7 phase 5: of those, at most this many for one address (so nobody can use up the day for everyone)
VOICE_ADDRESS_DAILY_LIMIT = "30"

[[d1_databases]]
binding = "DB"
database_name = "minehonk-hub"
# The deploy workflow fills in the real id (it creates the database the first time)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

# The free plan offers SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDO", "RelayDO"]
